<rect x="280" y="193" width="14" height="14" rx="3" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="302" y="200" font-size="12" fill="#5F5E5A" dominant-baseline="central">复制帧，没有任何新信息</text>
<text x="40" y="228" font-size="12" fill="#2C2C2A">15 减 12 等于 3：每秒 30 帧里只有 24 帧是新画面，6 帧是重复的</text>
<text x="40" y="244" font-size="11" fill="#888780">重复分布不均匀，人眼会读成顿挫，行话叫 judder</text>
