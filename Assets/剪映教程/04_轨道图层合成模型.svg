<svg width="680" viewBox="0 0 680 278" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>轨道与图层合成顺序</title>
<desc>视频轨按上下顺序叠加，音频轨独立混音</desc>
<rect x="40" y="40" width="36" height="32" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="58" y="56" text-anchor="middle" font-size="12" fill="#3C3489" dominant-baseline="central">V3</text>
<rect x="110" y="40" width="120" height="32" rx="6" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="170" y="56" text-anchor="middle" font-size="12" fill="#3C3489" dominant-baseline="central">画中画 2</text>
<rect x="40" y="78" width="36" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="58" y="94" text-anchor="middle" font-size="12" fill="#085041" dominant-baseline="central">V2</text>
<rect x="280" y="78" width="180" height="32" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="370" y="94" text-anchor="middle" font-size="12" fill="#085041" dominant-baseline="central">画中画 1</text>
<rect x="40" y="116" width="36" height="32" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="58" y="132" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">V1</text>
<rect x="86" y="116" width="534" height="32" rx="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="100" y="132" font-size="12" fill="#0C447C" dominant-baseline="central">主轨 — 磁性吸附，不能留空隙</text>
<line x1="40" y1="158" x2="640" y2="158" stroke="#D3D1C7" stroke-width="0.5"/>
<rect x="40" y="164" width="36" height="32" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="58" y="180" text-anchor="middle" font-size="12" fill="#633806" dominant-baseline="central">A1</text>
<rect x="86" y="164" width="534" height="32" rx="6" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="100" y="180" font-size="12" fill="#633806" dominant-baseline="central">背景音乐</text>
<rect x="40" y="202" width="36" height="32" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="58" y="218" text-anchor="middle" font-size="12" fill="#712B13" dominant-baseline="central">A2</text>
<rect x="250" y="202" width="220" height="32" rx="6" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text x="360" y="218" text-anchor="middle" font-size="12" fill="#712B13" dominant-baseline="central">人声</text>
<text x="40" y="258" font-size="12" fill="#888780">视频轨：越靠上越晚合成，上层盖住下层，α 决定透出多少</text>
<text x="40" y="274" font-size="12" fill="#888780">音频轨：不做覆盖，全部相加后混音，只靠音量避免打架</text>
</svg>