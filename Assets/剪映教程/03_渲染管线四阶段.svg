<svg width="680" viewBox="0 0 680 208" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>视频渲染管线</title>
<desc>从解码到编码的四个处理阶段，以及预览与导出的差异</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="56" width="120" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="100" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">解码</text>
<text x="100" y="102" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">读出每一帧像素</text>
<rect x="200" y="56" width="120" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="260" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">变换与调色</text>
<text x="260" y="102" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">位置 · LUT · 曲线</text>
<rect x="360" y="56" width="120" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="420" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">合成</text>
<text x="420" y="102" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">蒙版 · 混合 · 透明度</text>
<rect x="520" y="56" width="120" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="580" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#633806" dominant-baseline="central">编码</text>
<text x="580" y="102" text-anchor="middle" font-size="11" fill="#854F0B" dominant-baseline="central">H.264 / H.265</text>
<path d="M162 88 L196 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M322 88 L356 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M482 88 L516 88" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="144" width="600" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="166" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">播放：降分辨率 + 代理，够判断节奏就行</text>
<text x="340" y="184" text-anchor="middle" font-size="12" fill="#5F5E5A" dominant-baseline="central">导出：全分辨率、逐帧精确重算，结果与预览可能不同</text>
</svg>