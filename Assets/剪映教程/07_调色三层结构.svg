<svg width="680" viewBox="0 0 680 204" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title>调色的三层结构</title>
<desc>一级校正、二级局部、风格化三个递进阶段</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="50" width="170" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="125" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central">一级校正</text>
<text x="125" y="98" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central">曝光 · 白平衡 · 对比</text>
<rect x="255" y="50" width="170" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central">二级局部</text>
<text x="340" y="98" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central">HSL · 限定器 · 局部</text>
<rect x="470" y="50" width="170" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="555" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489" dominant-baseline="central">风格化</text>
<text x="555" y="98" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central">LUT · 色轮 · 分离色调</text>
<path d="M214 85 L251 85" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M429 85 L466 85" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="142" width="600" height="42" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="163" text-anchor="middle" font-size="13" fill="#2C2C2A" dominant-baseline="central">顺序不可逆：先把素材救回中性，再局部精修，最后才上风格</text>
</svg>